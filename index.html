<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Moulana Aktar Ali | Islamic Spiritual Consultation</title>
  <meta name="description" content="100% Confidential Islamic Spiritual Consultation by Moulana Aktar Ali for Love, Marriage, Family Peace, and Personal Guidance." />
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald-dark: #062114;
      --emerald-mid: #0c3521;
      --emerald-card: #092919;
      --ivory-bg: #F9F6EE;
      --ivory-card: #FFFFFF;
      --gold-matte: #C5A028;
      --gold-bright: #FFD700;
      --gold-soft: #F3D98B;
      --text-dark: #1C2520;
      --text-muted-dark: #4A5850;
      --whatsapp-green: #25D366;
      --call-amber: #E69D00;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', 'Noto Sans Gurmukhi', sans-serif;
      background-color: var(--emerald-dark);
      color: #ffffff;
      scroll-behavior: smooth;
    }

    body.lang-ur {
      font-family: 'Noto Nastaliq Urdu', 'Plus Jakarta Sans', sans-serif;
    }

    /* Top Trust Bar */
    .top-bar {
      background: #03140c;
      border-bottom: 1px solid rgba(197, 160, 40, 0.3);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--gold-soft);
    }

    .top-badges {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lang-select {
      background: var(--emerald-mid);
      color: var(--gold-bright);
      border: 1px solid var(--gold-matte);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(6, 33, 20, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(197, 160, 40, 0.35);
      padding: 12px 18px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, #144d30, #062114);
      border: 1.5px solid var(--gold-matte);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-bright);
      font-size: 18px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .brand-text h1 {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      color: var(--gold-bright);
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .brand-text span {
      font-size: 11px;
      color: #d0dfd6;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      color: #f4f7f5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--gold-bright);
    }

    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid var(--gold-matte);
      color: var(--gold-bright);
      font-size: 22px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }
      .nav-links {
        display: none;
        position: absolute;
        top: 63px;
        left: 0;
        width: 100%;
        background: #051c11;
        flex-direction: column;
        padding: 16px 20px;
        gap: 14px;
        border-bottom: 2px solid var(--gold-matte);
      }
      .nav-links.active {
        display: flex;
      }
    }

    /* Hero Section with Falling, Bouncing & Blinking Stars */
    .hero {
      position: relative;
      padding: 55px 18px 45px;
      text-align: center;
      background: radial-gradient(circle at top, #11472c 0%, #062114 68%, #03120b 100%);
      overflow: hidden;
      border-bottom: 2px solid var(--gold-matte);
    }

    .stars-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .star {
      position: absolute;
      top: -20px;
      color: #FFD700;
      text-shadow: 0 0 10px #FFD700, 0 0 20px #FFA500;
      animation: fallBounceBlink linear infinite;
      opacity: 0;
    }

    @keyframes fallBounceBlink {
      0% {
        transform: translateY(-20px) scale(0.7);
        opacity: 0;
      }
      15% {
        opacity: 1;
        transform: translateY(60px) scale(1.25);
      }
      30% {
        opacity: 0.3;
        transform: translateY(105px) scale(0.9);
      }
      45% {
        opacity: 1;
        transform: translateY(165px) scale(1.3);
      }
      60% {
        opacity: 0.25;
        transform: translateY(215px) scale(0.85);
      }
      75% {
        opacity: 1;
        transform: translateY(290px) scale(1.2);
      }
      100% {
        transform: translateY(420px) scale(0.7);
        opacity: 0;
      }
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 820px;
      margin: 0 auto;
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 30px;
      background: rgba(197, 160, 40, 0.15);
      border: 1px solid var(--gold-matte);
      color: var(--gold-bright);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .hero-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(28px, 6vw, 46px);
      font-weight: 800;
      color: var(--gold-bright);
      text-shadow: 0 2px 15px rgba(255, 215, 0, 0.35);
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 17px;
      color: #e6efe9;
      margin-bottom: 18px;
      font-weight: 500;
    }

    /* High-Contrast Sliding Hindi Ticker */
    .ticker-wrap {
      width: 100%;
      overflow: hidden;
      background: #FFD700;
      border-top: 2px solid #fff3a8;
      border-bottom: 2px solid #b8860b;
      padding: 10px 0;
      margin: 18px 0 24px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .ticker-move {
      display: inline-block;
      white-space: nowrap;
      animation: tickerScroll 24s linear infinite;
      color: #051a0f;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      padding-left: 100%;
    }

    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .hero-emotional-box {
      background: rgba(5, 24, 15, 0.78);
      border: 1px solid rgba(197, 160, 40, 0.45);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 26px;
    }

    .hero-emotional-hi {
      font-size: 16px;
      font-weight: 700;
      color: #FFD700;
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .hero-emotional-en {
      font-size: 14px;
      color: #e0ece5;
      line-height: 1.5;
    }

    /* Side-by-Side Bouncing Hero CTA Buttons */
    .hero-cta-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: nowrap;
    }

    .btn-cta {
      flex: 1;
      max-width: 210px;
      padding: 14px 14px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      animation: btnBouncePulse 2.2s infinite ease-in-out;
      transition: transform 0.2s;
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366, #169c48);
      color: #ffffff;
      border: 2px solid #a8f5c4;
      box-shadow: 0 0 18px rgba(37, 211, 102, 0.55);
    }

    .btn-call {
      background: linear-gradient(135deg, #FFD700, #d49400);
      color: #062114;
      border: 2px solid #fff3a8;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.55);
    }

    /* Shimmer light sweep on buttons */
    .btn-cta::after {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      animation: lightSweep 3.5s infinite;
    }

    @keyframes lightSweep {
      0% { left: -75%; }
      40% { left: 125%; }
      100% { left: 125%; }
    }

    @keyframes btnBouncePulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* Trust Strip */
    .trust-strip {
      background: #04170e;
      padding: 20px 16px;
      border-bottom: 1px solid rgba(197, 160, 40, 0.25);
    }

    .trust-grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      text-align: center;
    }

    .trust-item {
      padding: 12px 8px;
      border: 1px solid rgba(197, 160, 40, 0.25);

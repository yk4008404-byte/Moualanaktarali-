<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moulana Aktar Ali | Islamic Spiritual Consultation</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald: #062114;
      --emerald-mid: #0c3521;
      --ivory: #F9F6EE;
      --gold: #C5A028;
      --gold-bright: #FFD700;
      --text-dark: #1C2520;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; overflow-x: hidden; font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', 'Noto Sans Gurmukhi', sans-serif; background: var(--emerald); color: #fff; scroll-behavior: smooth; }
    body.lang-ur { font-family: 'Noto Nastaliq Urdu', sans-serif; direction: rtl; }

    /* Top Bar & Header */
    .top-bar { background: #03140c; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #F3D98B; border-bottom: 1px solid rgba(197,160,40,0.3); }
    .lang-select { background: var(--emerald-mid); color: var(--gold-bright); border: 1px solid var(--gold); padding: 4px 8px; border-radius: 6px; font-weight: 600; }
    header { position: sticky; top: 0; z-index: 900; background: rgba(6,33,20,0.97); border-bottom: 1px solid rgba(197,160,40,0.4); padding: 12px 18px; }
    .nav-wrap { max-width: 1150px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-icon { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--gold); display: flex; align-items: center; justify-content: center; color: var(--gold-bright); font-size: 18px; background: #0c3521; }
    .brand h1 { font-family: 'Cinzel', serif; font-size: 18px; color: var(--gold-bright); line-height: 1.1; }
    .brand span { font-size: 11px; color: #d0dfd6; display: block; }
    .nav-links { display: flex; gap: 18px; list-style: none; }
    .nav-links a { color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; }
    .menu-btn { display: none; background: none; border: 1px solid var(--gold); color: var(--gold-bright); font-size: 20px; padding: 3px 10px; border-radius: 6px; cursor: pointer; }
    @media (max-width: 768px) {
      .menu-btn { display: block; }
      .nav-links { display: none; position: absolute; top: 62px; left: 0; width: 100%; background: #051c11; flex-direction: column; padding: 16px; border-bottom: 2px solid var(--gold); gap: 12px; }
      .nav-links.active { display: flex; }
    }

    /* Hero & Falling Blinking Stars */
    .hero { position: relative; padding: 45px 18px 42px; text-align: center; background: radial-gradient(circle at top, #11472c 0%, #062114 70%); overflow: hidden; border-bottom: 2px solid var(--gold); }
    .stars-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .star { position: absolute; top: -20px; color: #FFD700; text-shadow: 0 0 10px #FFD700; animation: fallBounce 3s linear infinite; }
    @keyframes fallBounce {
      0% { transform: translateY(-10px) scale(0.8); opacity: 0; }
      20% { opacity: 1; transform: translateY(80px) scale(1.2); }
      45% { opacity: 0.3; transform: translateY(150px) scale(0.9); }
      70% { opacity: 1; transform: translateY(250px) scale(1.25); }
      100% { transform: translateY(380px) scale(0.8); opacity: 0; }
    }
    .hero-box { position: relative; z-index: 2; max-width: 800px; margin: 0 auto; }
    .hero-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; background: rgba(197,160,40,0.18); border: 1px solid var(--gold); color: var(--gold-bright); font-size: 13px; margin-bottom: 12px; }
    .hero-title { font-family: 'Cinzel', serif; font-size: clamp(28px, 6vw, 44px); color: var(--gold-bright); margin-bottom: 8px; }
    .hero-sub { font-size: 16px; color: #e6efe9; margin-bottom: 16px; }

    /* High Contrast Sliding Ticker */
    .ticker-wrap { width: 100%; overflow: hidden; background: #FFD700; padding: 10px 0; margin: 16px 0 22px; border-top: 2px solid #fff3a8; border-bottom: 2px solid #b8860b; }
    .ticker-move { display: inline-block; white-space: nowrap; animation: ticker 22s linear infinite; color: #051a0f; font-size: 16px; font-weight: 700; padding-left: 100%; }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

    .hero-note { background: rgba(5,24,15,0.85); border: 1px solid rgba(197,160,40,0.45); border-radius: 12px; padding: 14px 16px; margin-bottom: 24px; }
    .hero-note p.hi { color: #FFD700; font-weight: 700; font-size: 16px; line-height: 1.55; margin-bottom: 5px; }
    .hero-note p.en { color: #e0ece5; font-size: 14px; }

    /* Side-by-Side Bouncing Hero Buttons */
    .cta-row { display: flex; justify-content: center; gap: 12px; }
    .btn-cta { flex: 1; max-width: 200px; padding: 13px 12px; border-radius: 50px; font-weight: 700; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; animation: bounceBtn 2s infinite ease-in-out; }
    .btn-wa { background: #25D366; color: #fff; border: 2px solid #b5f7ce; box-shadow: 0 0 15px rgba(37,211,102,0.5); }
    .btn-call { background: #FFD700; color: #062114; border: 2px solid #fff5b8; box-shadow: 0 0 15px rgba(255,215,0,0.5); }
    @keyframes bounceBtn { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    /* Sections */
    .sec-ivory { background: var(--ivory); color: var(--text-dark); padding: 48px 18px; }
    .sec-emerald { background: var(--emerald); color: #fff; padding: 48px 18px; border-top: 1px solid rgba(197,160,40,0.3); }
    .container { max-width: 1120px; margin: 0 auto; }
    .sec-head { text-align: center; margin-bottom: 32px; }
    .sec-tag { font-size: 12px; font-weight: 700; color: var(--gold); letter-spacing: 1.2px; text-transform: uppercase; display: block; margin-bottom: 6px; }
    .sec-ivory .sec-title { font-family: 'Cinzel', serif; font-size: 28px; color: #072918; margin-bottom: 8px; }
    .sec-emerald .sec-title { font-family: 'Cinzel', serif; font-size: 28px; color: var(--gold-bright); margin-bottom: 8px; }
    .sec-desc { font-size: 15px; max-width: 640px; margin: 0 auto; line-height: 1.55; opacity: 0.9; }

    /* Service & Keyword Cards with Running Golden Border */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
    .card-frame { position: relative; border-radius: 16px; padding: 4px; background: #0a4d2e; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
    .card-frame::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent 0deg, transparent 270deg, #FFD700 320deg, #fff6b3 345deg, transparent 360deg); animation: spinBorder 3.5s linear infinite; }
    @keyframes spinBorder { 100% { transform: rotate(360deg); } }
    .card-inner { position: relative; z-index: 1; background: #fff; border-radius: 12px; overflow: hidden; height: 100%; display: flex; flex-direction: column; border: 2px solid #0a4d2e; }
    .card-img { width: 100%; height: 230px; background: #0c3521; overflow: hidden; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 19px; font-weight: 700; color: #072918; margin-bottom: 6px; }
    .card-text { font-size: 14px; color: #46544c; line-height: 1.5; margin-bottom: 14px; }
    .card-btns { display: flex; gap: 10px; }
    .c-btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; text-align: center; text-decoration: none; }
    .c-wa { background: #0d6e3d; color: #fff; }
    .c-call { background: #C5A028; color: #062114; }

    /* Stats, Steps & About */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
    .stat-box { background: rgba(12,53,33,0.6); border: 1.5px solid var(--gold); border-radius: 14px; padding: 22px 14px; text-align: center; }
    .stat-num { font-family: 'Cinzel', serif; font-size: 32px; font-weight: 800; color: var(--gold-bright); }
    .step-box { background: #fff; border: 2px solid #0c3521; border-radius: 14px; padding: 22px 16px; text-align: center; }
    .step-num { width: 42px; height: 42px; margin: 0 auto 12px; border-radius: 50%; background: #062114; color: #FFD700; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 800; }

    /* Blinking About Logo with Running Yellow Border */
    .about-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px; align-items: center; }
    .logo-ring { position: relative; width: 220px; height: 220px; margin: 0 auto; border-radius: 50%; padding: 5px; background: #0a4d2e; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .logo-ring::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent 0deg, transparent 240deg, #ffea00 310deg, #ffffff 345deg, transparent 360deg); animation: spinBorder 2.8s linear infinite; }
